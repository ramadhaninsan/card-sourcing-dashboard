<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Sourcing Dashboard</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #111;
    background: #f6f6f4;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px; }
  h1 { margin: 0 0 8px; font-size: 1.3rem; }
  .banner {
    margin: 0;
    padding: 8px 10px;
    border: 1px solid #b8860b;
    background: #fff6d8;
    border-radius: 6px;
    font-size: .9rem;
  }
  .controls { display: grid; gap: 10px; margin: 14px 0; }
  .controls label { display: block; margin-bottom: 4px; font-size: .85rem; font-weight: 600; }
  .controls label.check {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    margin: 0;
    font-size: .95rem;
  }
  .controls input[type="checkbox"] { width: 20px; height: 20px; }
  input[type="search"], select {
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 16px;
    font-family: inherit;
    color: #111;
    background: #fff;
    border: 1px solid #999;
    border-radius: 6px;
  }
  .count { margin: 0 0 10px; color: #444; font-size: .9rem; }
  .error {
    margin: 0 0 10px;
    padding: 10px;
    border: 1px solid #a33;
    background: #fdecec;
    color: #7a1010;
    border-radius: 6px;
  }
  .empty {
    margin: 0;
    padding: 24px 10px;
    text-align: center;
    color: #444;
    background: #fff;
    border: 1px dashed #bbb;
    border-radius: 8px;
  }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 0; padding: 0; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  .cover, .noimg { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #eee; }
  .noimg { display: flex; align-items: center; justify-content: center; color: #666; font-size: .9rem; }
  .card-body { padding: 10px; }
  .card h2 { margin: 0 0 6px; font-size: 1rem; line-height: 1.35; overflow-wrap: anywhere; }
  .price { margin: 0 0 6px; font-size: 1.15rem; font-weight: 700; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 6px; }
  .chip {
    padding: 3px 8px;
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .03em;
    border: 1px solid;
    border-radius: 999px;
  }
  .chip-new { background: #dff3e6; color: #0a5c28; border-color: #79bf95; }
  .chip-seen { background: #fff1cc; color: #7a5200; border-color: #d9ab3d; }
  .chip-inactive, .chip-unknown { background: #e9e9e9; color: #444; border-color: #aaa; }
  .condition { font-size: .85rem; color: #333; }
  .muted { margin: 0; color: #555; font-size: .8rem; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .thumbs img { width: 48px; height: 48px; object-fit: cover; background: #eee; border: 1px solid #ccc; border-radius: 4px; }
  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .controls { grid-template-columns: 2fr 1fr; align-items: end; }
    .controls .check { grid-column: 1 / -1; }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Card Sourcing Dashboard</h1>
    <p class="banner" id="banner">Demo data only — live sourcing is not connected yet.</p>
  </header>

  <main>
    <div class="controls">
      <div>
        <label for="q">Search by title</label>
        <input id="q" type="search" placeholder="e.g. リザードン" autocomplete="off">
      </div>
      <div>
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="asc">Price: low → high</option>
          <option value="desc">Price: high → low</option>
        </select>
      </div>
      <label class="check"><input id="showInactive" type="checkbox" checked> Show INACTIVE items</label>
    </div>

    <p class="count" id="count" aria-live="polite">Loading…</p>
    <p class="error" id="error" hidden></p>
    <section class="grid" id="listings" aria-label="Listings"></section>
    <p class="empty" id="empty" hidden></p>
    <noscript><p class="empty">This page needs JavaScript to load and filter the listings.</p></noscript>
  </main>
</div>

<script>
(function () {
  'use strict';

  var STATUS_CLASS = { NEW: 'chip-new', SEEN: 'chip-seen', INACTIVE: 'chip-inactive' };
  var state = { all: [], query: '', sort: 'asc', showInactive: true };

  var banner = document.getElementById('banner');
  var searchInput = document.getElementById('q');
  var sortSelect = document.getElementById('sort');
  var showInactiveBox = document.getElementById('showInactive');
  var countLine = document.getElementById('count');
  var errorBox = document.getElementById('error');
  var grid = document.getElementById('listings');
  var emptyBox = document.getElementById('empty');

  function makeEl(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function formatPrice(value) {
    var n = Number(value);
    return Number.isFinite(n) ? '¥' + n.toLocaleString('en-US') : '¥—';
  }

  function buildCard(listing) {
    var title = typeof listing.title === 'string' && listing.title ? listing.title : 'Untitled listing';
    var images = Array.isArray(listing.images) ? listing.images : [];

    var card = makeEl('article', 'card');

    if (images.length > 0) {
      var cover = makeEl('img', 'cover');
      cover.src = images[0];
      cover.alt = title + ' — cover image';
      cover.loading = 'lazy';
      card.appendChild(cover);
    } else {
      card.appendChild(makeEl('div', 'noimg', 'No image'));
    }

    var body = makeEl('div', 'card-body');
    body.appendChild(makeEl('h2', '', title));
    body.appendChild(makeEl('p', 'price', formatPrice(listing.price_jpy)));

    var meta = makeEl('p', 'meta');
    var status = String(listing.status || 'UNKNOWN').toUpperCase();
    meta.appendChild(makeEl('span', 'chip ' + (STATUS_CLASS[status] || 'chip-unknown'), status));
    meta.appendChild(makeEl('span', 'condition', 'Condition ' + (listing.condition || '—')));
    body.appendChild(meta);

    var detected = new Date(listing.detected_at);
    if (!Number.isNaN(detected.getTime())) {
      body.appendChild(makeEl('p', 'muted', 'Detected ' + detected.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'));
    }

    if (images.length > 1) {
      var strip = makeEl('div', 'thumbs');
      for (var i = 1; i < images.length; i++) {
        var thumb = makeEl('img');
        thumb.src = images[i];
        thumb.alt = title + ' — image ' + (i + 1);
        thumb.loading = 'lazy';
        strip.appendChild(thumb);
      }
      body.appendChild(strip);
    }

    card.appendChild(body);
    return card;
  }

  function render() {
    var q = state.query.trim().toLowerCase();
    var items = state.all.filter(function (listing) {
      return typeof listing.title === 'string' && listing.title.toLowerCase().indexOf(q) !== -1;
    });

    if (!state.showInactive) {
      items = items.filter(function (listing) {
        return String(listing.status || '').toUpperCase() !== 'INACTIVE';
      });
    }

    items.sort(function (a, b) {
      var pa = Number(a.price_jpy);
      var pb = Number(b.price_jpy);
      if (!Number.isFinite(pa)) pa = 0;
      if (!Number.isFinite(pb)) pb = 0;
      return state.sort === 'asc' ? pa - pb : pb - pa;
    });

    grid.replaceChildren.apply(grid, items.map(buildCard));
    countLine.textContent = items.length + ' of ' + state.all.length + ' shown';

    if (items.length > 0) {
      emptyBox.hidden = true;
    } else {
      emptyBox.hidden = false;
      emptyBox.textContent = state.all.length === 0
        ? 'No listings available yet.'
        : 'No listings match your search.';
    }
  }

  function load() {
    fetch('data/listings.json', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        state.all = Array.isArray(data.listings) ? data.listings : [];
        if (data.demo === false) {
          banner.textContent = 'Live data' + (data.generated_at ? ' — generated ' + data.generated_at : '') + '.';
        }
        render();
      })
      .catch(function (err) {
        errorBox.textContent = 'Could not load data/listings.json: ' + err.message + '. Open this page from a web server (not file://) and check that the file exists.';
        errorBox.hidden = false;
        countLine.textContent = '';
      });
  }

  searchInput.addEventListener('input', function () { state.query = searchInput.value; render(); });
  sortSelect.addEventListener('change', function () { state.sort = sortSelect.value; render(); });
  showInactiveBox.addEventListener('change', function () { state.showInactive = showInactiveBox.checked; render(); });

  load();
})();
</script>
</body>
</html>
